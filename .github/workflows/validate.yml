name: validate

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          set -e
          bash -n install.sh update.sh uninstall.sh
          for f in tools/*.sh; do bash -n "$f"; done
          for f in bin/*; do bash -n "$f"; done
          bash -n dotfiles/.config/dwl/start
      - name: Python syntax and repository invariants
        run: |
          python3 -m py_compile lib/*.py tools/*.py
          python3 tools/repo-check.py

  arch-build-smoke:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install current Arch build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git python pkgconf wlroots0.20 libinput wayland wayland-protocols \
            libxkbcommon libxcb xcb-util-wm xorg-xwayland fcft pixman tllist
      - uses: actions/checkout@v4
      - name: Verify dwlb pkg-config dependency closure
        run: |
          pkg-config --exists wayland-client wayland-cursor fcft pixman-1 tllist
          pkg-config --cflags wayland-client wayland-cursor fcft pixman-1 >/dev/null
      - name: Compile patched dwl 0.9 and dwlb
        env:
          SANE_BUILD_ONLY: "1"
          SANE_KEYBOARD_LAYOUT: "br"
          SANE_WLROOTS_ABI: "0.20"
        run: ./tools/build-components.sh "$GITHUB_WORKSPACE"
